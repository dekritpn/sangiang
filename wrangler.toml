name = "sangiang"
main = "src/worker.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = true

routes = [
  { pattern = "sangihe.org/*", zone_name = "sangihe.org" },
  { pattern = "www.sangihe.org/*", zone_name = "sangihe.org" },
  { pattern = "translate.sangihe.org", custom_domain = true },
  { pattern = "chat.sangihe.org", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "sangiang-db"
database_id = "25a13421-a6b1-4739-98db-6cf0cd95c2a5"

[durable_objects]
bindings = [
  { name = "GEMINI_PROXY", class_name = "GeminiProxyDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiProxyDO"]
