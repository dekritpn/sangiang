[project]
name = "sangihe-translation-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "dekrit@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "rich>=15.0.0",
    "sacrebleu>=2.6.0",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
sangihe-translation-engine = "sangihe_translation_engine:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
